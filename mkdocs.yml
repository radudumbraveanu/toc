site_name: toc — Radu's table of contents
site_description: Know it exists. Dig in when you need it.
site_url: https://radudumbraveanu.github.io/toc/
copyright: >-
  &copy; 2026 Radu Dumbrăveanu &middot;
  Content <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> &middot;
  Code <a href="https://opensource.org/license/mit">MIT</a>
docs_dir: docs
theme:
  name: material
  features:
    - navigation.top
# Cards are rendered into the index page by hooks/feed.py; no separate pages.
markdown_extensions:
  - footnotes
exclude_docs: |
  *.md
  !index.md
hooks:
  - hooks/feed.py
